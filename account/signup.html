<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/default.css" rel="stylesheet">
    <link href="/css/colors.css" rel="stylesheet">
    <link href="/css/text.css" rel="stylesheet">
    <link href="./signup.css" rel="stylesheet">
    <script src="/lib/back.js" type="module"></script>
    <script src="./signup.js" type="module"></script>
    <title>myHawkerSG | Signup As User</title>
</head>
<body>
    <!--left side image-->
    <section id="left">
        
    </section>
    <!--right side signup page-->
    <section id="right">
        <form>
            <h1>myHawkerSG</h1>
            <h2>Signup</h2>
            <label for="full_name">Full Name:</label>
            <input type="text" name="full_name" placeholder="Bob Tan" id="full_name">
            <label for="username">Username:</label>
            <input type="text" name="username" placeholder="bob" id="username">
            <input type="text" name="username" placeholder="bob" id="username">
            <label for="password">Password:</label>
            <input type="text" name="password" placeholder="********" id="password">
            <label for="re-enter_password">Re-Enter:</label>
            <input type="text" name="re-enter_password" placeholder="********" id="new_password">
            <label for="dob">Date of Birth:</label>
            <input type="text" name="dob" placeholder="dd mm yy" id="dob">
            <button id="signup" type="button">Signup</button>
            <label id="login">Login?</label>
        </form>   
    </section>
</body>
</html>
