<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/default.css" rel="stylesheet">
    <link href="/css/colors.css" rel="stylesheet">
    <link href="/css/text.css" rel="stylesheet">
    <link href="/css/status.css" rel="stylesheet">
    <link href="./index.css" rel="stylesheet">
    <script src="/lib/back.js" type="module"></script>
    <script src="./index.js" type="module"></script>
    <title>myHawkerSG | Order</title>
</head>
<body>
    <nav>
        <a id="back" href="#" onclick="history.back(); return false;"><img src="https://unpkg.com/lucide-static@latest/icons/chevron-left.svg" width="32px" height="32px"/></a>
    </nav>
    <header>
        <h1>Order #192-414</h1>
        <span class="status active">ACTIVE</span>
    </header>
    <section id="content">
        <div class="col" id="left">
            <div class="part border">
                    <div id="items">
                        <!--index.js -->
                        <h2>Items</h2>
                    </div>
                </div>
            <div class="part border">
                <h2>Special Instructions</h2>
                    <p id="special-instructions">No special instructions.</p>
            </div>
        </div>
        <div class="col">
            <div class="part border">
                <h2>Paid Amount</h2>
                <div id="pricing">
                    <span class="price">
                        <span class="priceitem">Subtotal</span>
                        <span class="priceamt">$12</span>
                    </span>
                    <span class="price">
                        <span class="priceitem">Platform Fee</span>
                        <span class="priceamt">$1.49</span>
                    </span>
                    <span class="price" id="totalpaid">
                        <span class="priceitem">Total Paid</span>
                        <span class="priceamt">$13.49</span>
                    </span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
