<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/default.css" rel="stylesheet">
    <link href="/css/colors.css" rel="stylesheet">
    <link href="/css/text.css" rel="stylesheet">
    <link href="./index.css" rel="stylesheet">
    <script src="/lib/back.js" type="module"/></script>
    <script src="./index.js" type="module"/></script>
    <title>myHawkerSG | Account </title>
</head>
<body>
    <nav id="back">
        <a href="javascript:history.back()">Back</a>
    </nav>
    <header>
        <h1>Account</h1>
        <button id="order_history" type="button">Order History</button>
    </header>
    <section id="header">
        <div>
            <h2>Username :</h2> <input type="username" placeholder="username" id="username">
            <h2>Password :</h2> <input type="password" placeholder="password" id="password">

            <section>
                <h2>Change Password:</h2>
                <label for="current_password">Current Password:</label>
                <input type="password" placeholder="current password" id="current_password">
                <div></div>
                <label for="new_password">New Password:</label>
                <input type="password" placeholder="new password" id="new_password">
                <div id="name">
                    <label for="new_name">New Name:</label>
                    <input type="new name" placeholder="new name" id="new_name">
                </div> 
                <button id="saveBtn">Save Changes</button>
            </section>
            

        </div>
    </section>

</body>
