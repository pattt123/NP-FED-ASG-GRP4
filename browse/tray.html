<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/default.css" rel="stylesheet">
    <link href="/css/colors.css" rel="stylesheet">
    <link href="/css/text.css" rel="stylesheet">
    <link href="./tray.css" rel="stylesheet">
    <title>Shopping Cart Checkout</title>
</head>

<body>
    <button class="tray" onclick="toggleCart()">Tray</button>
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <div class="cart-tray" id="cartTray">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-btn" onclick="toggleCart()">x</button>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Cart items will be rendered here -->
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-row ">
                <span>Platform Fee</span>
                <span id="platform">$0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="total">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>
</body>
<script src="./tray.js"></script>

</html>
