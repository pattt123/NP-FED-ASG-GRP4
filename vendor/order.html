<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/default.css" rel="stylesheet">
    <link href="/css/colors.css" rel="stylesheet">
    <link href="/css/text.css" rel="stylesheet">
    <link href="/css/status.css" rel="stylesheet">
    <link href="./order.css" rel="stylesheet">
    <script src="/lib/back.js" type="module"></script>
    <script src="./order.js" type="module"></script>
    <title>myHawkerSG | Vendor Order</title>
</head>
<body>
    <nav>
        <a id="back" href="/vendor/"><img src="https://unpkg.com/lucide-static@latest/icons/chevron-left.svg" width="32px" height="32px"/></a>
    </nav>
    <header>
        <h1>Order #-------</h1>
        <span id="status" class="status %%status%%">LOADING ORDER</span>
    </header>
    <section id="content">
        <div class="col" id="left">
            <div class="part border">
                <div id="items-head">
                    <h2>Items</h2>
                    <span id="stallname"></span>
                </div>
                <div id="items">LOADING</div>
            </div>
            <div class="part border">
                <h2>Special Instructions</h2>
                <p id="instructions">
                    LOADING
                </p>
            </div>
        </div>
        <div class="col">
            <div class="part border">
                <h2>Paid Amount</h2>
                <div id="pricing">
                    <span class="price">
                        <span class="priceitem">Subtotal</span>
                        <span id="subtotal" class="priceamt">$?</span>
                    </span>
                    <span class="price">
                        <span class="priceitem">Platform Fee</span>
                        <span id="fee" class="priceamt">$?</span>
                    </span>
                    <span class="price" id="totalpaid">
                        <span class="priceitem">Total Paid</span>
                        <span id="total" class="priceamt">$?</span>
                    </span>
                </div>
            </div>
            <div class="part border">
                <h2>Change Status</h2>
                <div id="actions">
                    <button class="received" type="button">Receive</button>
                    <button class="preparing" type="button">Prepare</button>
                    <button class="ready" type="button">Ready</button>
                    <button class="completed"type="button">Complete</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
